[project]
name = "jenga-vision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pyusb>=1.3.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[project.scripts]
jenga-view = "jenga_vision.viewer:main"
jenga-capture = "jenga_vision.capture:main"
jenga-live = "jenga_vision.live:main"
jenga-led = "jenga_vision.led:main"
jenga-live-edge = "jenga_vision.live_edge:main"
jenga-scan = "jenga_vision.scan:main"
jenga-pick = "jenga_vision.pick:main"
jenga-tower = "jenga_vision.tower:main"
jenga-layers = "jenga_vision.layers:main"
